<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#005EFF">
    <meta name="description" content="Piggy Bank teller dashboard — search accounts, add users, deposit, withdraw and transfer.">
    <link rel="icon" href="images/PIGGYBANKlogo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="result.css"/>
    <title>Banking App.</title>
</head>
<body>

<!--- MODAL ---->
<div id="modal" onclick="closeAllModals()"></div>
<div class="modal-dock">
    <div id="modalBox" role="alertdialog" aria-live="assertive" aria-labelledby="modalText">
        <p id="modalText"></p>
        <p id="modalQuestion" hidden></p>
        <div class="modalActions">
            <div id="closeModal" class="modalBtn" role="button" tabindex="0" onclick="closeAllModals()">Ok</div>
            <div id="modalNo" class="modalBtn modalBtnGhost" role="button" tabindex="0" hidden>No</div>
            <div id="modalYes" class="modalBtn" role="button" tabindex="0" hidden>Yes</div>
        </div>
    </div>
</div>

<div class="app">

<!--- NAVIGATION RAIL ---->
    <nav id="header" aria-label="Main menu" >
        <img src="images/PIGGY BANK.png" id="toLoad" alt="Piggy Bank home" title="Refresh" role="button" tabindex="0"/>
        <span class="brandName">Piggy Bank</span>

    </nav>


<!--- MAIN COLUMN ---->
    <main class="main">

        <header class="topbar">
            <div class="greet">
                <h1 class="greet-line">
                    <span id="greeting">Good Day</span>
                    <span id="introName"></span>
                </h1>
                <p id="quotes">Keep up the good work even when no one is watching</p>
            </div>

            <div id="containerBlue">
                <div id="timeForEmployee"></div>
                <div class="clock-date">
                    <div id="day">Monday</div>
                    <div id="dateForEmployee"></div>
                </div>
            </div>
        </header>

        <section class="stage">
        <div class="rail-items">
            <div id="iconcontphone" aria-hidden="true"></div>

            <div class="rail-item">
                <span id="iconsOne" class="rail-icon" onclick="showSearch()" role="button" tabindex="0" aria-label="Search user" title="SEARCH"></span>
            </div>
            <div class="rail-item">
                <span id="iconsTwo" class="rail-icon" onclick="showHistory()" role="button" tabindex="0" aria-label="View history" title="VIEW HISTORY"></span>
            </div>
            <div class="rail-item">
                <span id="iconsThree" class="rail-icon" onclick="showAdduser()" role="button" tabindex="0" aria-label="Add new user" title="ADD NEW USER"></span>
            </div>
            <div class="rail-item">
                <span id="iconsFour" class="rail-icon" onclick="showTransac()" role="button" tabindex="0" aria-label="Transactions" title="TRANSAC USER"></span>
            </div>
        </div>
            <img id="backgroundVector" src="images/backgroundimage.png" alt="" aria-hidden="true">

<!---SEARCH FORM---->
            <section class="panel panel--search" aria-label="Search user">
                <form id="searchFormContainer">
                    <div id="titleSearch" class="section-title">SEARCH USER</div>
                    <!-- No field is required on its own: search by name, by account number, or both -->
                    <input type="text" id="searchFirstName" placeholder="First Name" aria-label="First name" autocomplete="off">
                    <input type="text" id="searchLastName" placeholder="Last Name" aria-label="Last name" autocomplete="off">
                    <input type="number" id="searchAccount" placeholder="Account Number" aria-label="Account number">
                    <input type="submit" id="searchbutton" value="SEARCH">
                </form>

                <div id="getBalance"></div>
                <table id="searchResult"></table>

                <div class="hideBtn" id="hideBtnSearch" onclick="hide_all()" role="button" tabindex="0" title="Close">X</div>
            </section>

<!---HISTORY DATA---->
            <section class="panel panel--history" aria-label="Account list">
                <div id="historyContainer">
                    <p id="historyLabel">
                        <span class="span">Account</span>
                        <span class="span1">Name</span>
                        <span class="span4">Date</span>
                        <span class="span5">Time</span>
                        <span class="span2">Balance</span>
                    </p>
                    <table id="historyInput"></table>
                </div>

                <div class="hideBtn" id="hideBtnHistory" onclick="hide_all()" role="button" tabindex="0" title="Close">X</div>
            </section>

<!---ADD USER FORM---->
            <section class="panel panel--adduser" aria-label="Add user">
                <form id="aduserInputContainer">
                    <div id="titleAduser" class="section-title">ADD USER</div>

                    <input type="text" class="aduserInputs" id="fIrstNameAduser" placeholder="First Name" aria-label="First name" autocomplete="off" required>
                    <input type="text" class="aduserInputs" id="lastNameAduser" placeholder="Last Name" aria-label="Last name" autocomplete="off" required>

                    <label for="dateofBirthAduser" id="dateofBirth">Date of birth</label>
                    <input type="date" class="aduserInputs" id="dateofBirthAduser" placeholder="MM/DD/YYYY">

                    <label for="initialDepositAduser" id="initialDeposit">Initial Deposit</label>
                    <input type="number" class="aduserInputs" id="initialDepositAduser" placeholder="Amount" min="0" step="0.01" required>

                    <input type="submit" id="addButton" value="ADD">
                </form>

                <div class="hideBtn" id="hideBtnAduser" onclick="hide_all()" role="button" tabindex="0" title="Close">X</div>
            </section>

<!---TRANSACTION FORMS---->
            <section class="panel panel--transac" aria-label="Transactions">
                <div id="titleTransac" class="titleBtn1">
                    <div id="depositBtn" onclick="depoForm()" role="button" tabindex="0">Deposit</div>
                    <div id="WithdrawBtn" onclick="withdrawForm()" role="button" tabindex="0">Withdraw</div>
                    <div id="TransferBtn" onclick="TransFer()" role="button" tabindex="0">Transfer</div>
                </div>

                <div class="transac-stack">
<!---DEPOSIT---->
                    <form id="depoContainer" class="containerExtra">
                        <p class="userDetails">DEPOSIT</p>
                        <div class="fieldWrap">
                            <input role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="pickList" type="text" class="transacInputs" id="transacfirstName" placeholder="First Name" aria-label="First name" autocomplete="off" aria-describedby="transacfirstNameError">
                        </div>
                        <p class="fieldError" id="transacfirstNameError" aria-live="polite"></p>
                        <div class="fieldWrap">
                            <input role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="pickList" type="text" class="transacInputs" id="transaclastName" placeholder="Last Name" aria-label="Last name" autocomplete="off" aria-describedby="transaclastNameError">
                        </div>
                        <p class="fieldError" id="transaclastNameError" aria-live="polite"></p>
                        <label for="depoaccountNumber" class="numberLabel">Account Number</label>
                        <div class="fieldWrap">
                            <input role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="pickList" type="number" class="transacInputs" id="depoaccountNumber" placeholder="XX-XXXX-XXXX" aria-describedby="depoaccountNumberError">
                        </div>
                        <p class="fieldError" id="depoaccountNumberError" aria-live="polite"></p>
                        <label for="depoAmount" class="numberLabel">Deposit Amount</label>
                        <input type="number" class="transacInputs" id="depoAmount" placeholder="Amount" min="0" step="0.01">
                        <input type="submit" class="depoButton" id="depoButtonId" value="DEPOSIT">
                    </form>

<!---WITHDRAW---->
                    <form id="withdrawForm">
                        <p class="userDetails">Enter User's Details</p>
                        <div class="fieldWrap">
                            <input role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="pickList" type="text" class="transacInputs" id="withdrawfirstName" placeholder="First Name" aria-label="First name" autocomplete="off" aria-describedby="withdrawfirstNameError">
                        </div>
                        <p class="fieldError" id="withdrawfirstNameError" aria-live="polite"></p>
                        <div class="fieldWrap">
                            <input role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="pickList" type="text" class="transacInputs" id="withdrawlastName" placeholder="Last Name" aria-label="Last name" autocomplete="off" aria-describedby="withdrawlastNameError">
                        </div>
                        <p class="fieldError" id="withdrawlastNameError" aria-live="polite"></p>
                        <label for="withdrawccountNumber" class="numberLabel">Account Number</label>
                        <div class="fieldWrap">
                            <input role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="pickList" type="number" class="transacInputs" id="withdrawccountNumber" placeholder="XX-XXXX-XXXX" aria-describedby="withdrawccountNumberError">
                        </div>
                        <p class="fieldError" id="withdrawccountNumberError" aria-live="polite"></p>
                        <label for="withdrawAmount" class="numberLabel">Withdraw Amount</label>
                        <input type="number" class="transacInputs" id="withdrawAmount" placeholder="Amount" min="0" step="0.01">
                        <input type="submit" class="withdrawButton" id="withdrawButtonId" value="WITHDRAW">
                    </form>

<!---TRANSFER---->
                    <div id="transferContainer">
                        <form id="userTransferForm">
                            <p class="userDetails1">Enter User's Details</p>
                            <div class="fieldWrap">
                                <input role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="pickList" type="text" class="transacInputs1" id="transacfirstName1" placeholder="First Name" aria-label="Sender first name" autocomplete="off" aria-describedby="transacfirstName1Error">
                            </div>
                            <p class="fieldError" id="transacfirstName1Error" aria-live="polite"></p>
                            <div class="fieldWrap">
                                <input role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="pickList" type="text" class="transacInputs1" id="transacmiddleName1" placeholder="Last Name" aria-label="Sender last name" autocomplete="off" aria-describedby="transacmiddleName1Error">
                            </div>
                            <p class="fieldError" id="transacmiddleName1Error" aria-live="polite"></p>
                            <label for="senderAccountNumber" class="numberLabel1">Account Number</label>
                            <div class="fieldWrap">
                                <input role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="pickList" type="number" class="transacInputs1" id="senderAccountNumber" placeholder="XX-XXXX-XXXX" aria-describedby="senderAccountNumberError">
                            </div>
                            <p class="fieldError" id="senderAccountNumberError" aria-live="polite"></p>
                            <label for="sendAmount" class="numberLabel1">Transfer Amount</label>
                            <input type="number" class="transacInputs1" id="sendAmount" placeholder="Amount" min="0" step="0.01" required>
                        </form>

                        <form id="receiverTransferForm">
                            <p class="receiverDetails">Enter Receiver's Details</p>
                            <div class="fieldWrap">
                                <input role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="pickList" type="text" class="transacInputs2" id="transacfirstName2" placeholder="First Name" aria-label="Receiver first name" autocomplete="off" aria-describedby="transacfirstName2Error">
                            </div>
                            <p class="fieldError" id="transacfirstName2Error" aria-live="polite"></p>
                            <div class="fieldWrap">
                                <input role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="pickList" type="text" class="transacInputs2" id="transacmiddleName2" placeholder="Last Name" aria-label="Receiver last name" autocomplete="off" aria-describedby="transacmiddleName2Error">
                            </div>
                            <p class="fieldError" id="transacmiddleName2Error" aria-live="polite"></p>
                            <label for="receiverAccountNumber" class="numberLabel2">Account Number</label>
                            <div class="fieldWrap">
                                <input role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="pickList" type="number" class="transacInputs2" id="receiverAccountNumber" placeholder="XX-XXXX-XXXX" aria-describedby="receiverAccountNumberError">
                            </div>
                            <p class="fieldError" id="receiverAccountNumberError" aria-live="polite"></p>
                            <input type="submit" class="transferButton" id="transferButtonId" value="TRANSFER">
                        </form>
                    </div>
                </div>

                <div class="hideBtn" id="hideBtnWithdraw" onclick="hide_all()" role="button" tabindex="0" title="Close">X</div>
            </section>

        </section>
    </main>
</div>


<script src="resultjs.js"></script>
</body>
</html>
