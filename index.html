<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#005EFF">
    <meta name="description" content="Piggy Bank — teller log in.">
    <link rel="icon" href="images/PIGGYBANKlogo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css"/>
    <title>Piggy Bank Log In</title>
</head>
<body>
    <main class="logInShell">
        <img src="images/PIGGYBANKlogo.png" id="piggyBank" alt="Piggy Bank">

        <form action="result app.html" method="get" id="containerFormLogIn">
            <input type="text" class="logInInputs" id="userName" name="userName" placeholder="First Name" aria-label="First name" autocomplete="given-name" required>
            <input type="text" class="logInInputs" id="lastName" placeholder="Lastname" aria-label="Last name" autocomplete="family-name" required>

            <div class="passwordRow">
                <input type="password" class="logInInputs" id="passWord" placeholder="Password" maxlength="6" aria-label="Password" autocomplete="current-password" required>
                <input type="checkbox" id="checkBox" onclick="viewPassword()" aria-label="Show password" title="Show password">
            </div>

            <input type="submit" id="logIn" value="Log In">
        </form>
    </main>

<script>
    function viewPassword() {
        let view = document.getElementById("passWord");
        view.type = view.type === "password" ? "text" : "password";
    }
</script>
</body>
</html>
